<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
<title>Меню · Хачо и Пури / Пхали-Хинкали</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#EDE7E5;
    --surface:#FBF9F8;
    --surface-2:#F3EDEC;
    --ink:#332C2C;
    --muted:#8C7E7E;
    --line:#DED4D2;
    --accent:#B7A8A8;
    --accent-ink:#6B5858;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:40px 16px 60px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  header{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; margin-bottom:34px;}
  header h1{
    font-family:'Manrope',sans-serif; font-size:1.7rem; font-weight:700; margin:0;
    letter-spacing:-.02em; line-height:1.1;
  }
  header .sub{
    font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.09em;
    color:var(--muted); text-transform:uppercase;
  }
  .cards{display:flex; flex-direction:column; gap:10px;}
  a.card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:8px;
    padding:16px 18px; text-decoration:none; color:var(--ink);
    transition:border-color .15s ease, box-shadow .18s ease, transform .18s ease;
  }
  @media (hover:hover){
    a.card:hover{ border-color:var(--accent-ink); box-shadow:0 4px 16px rgba(51,44,44,0.09); transform:translateY(-1px); }
  }
  .card-name{font-family:'Fraunces',serif; font-size:1.08rem; font-weight:500;}
  .card-arrow{font-family:'IBM Plex Mono',monospace; font-size:1rem; color:var(--accent-ink);}

  .card.disabled{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:1.5px dashed var(--line); border-radius:8px;
    padding:16px 18px; color:var(--muted); cursor:default;
  }
  .card.disabled .card-name{color:var(--muted); font-weight:400;}
  .soon{
    font-family:'IBM Plex Mono',monospace; font-size:.64rem; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:2px 7px; background:var(--surface);
  }

  footer{
    max-width:520px; margin:36px auto 0; padding:0 18px; color:var(--muted);
    font-size:.74rem; line-height:1.5; text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Меню</h1>
<span class="sub">Хачо и Пури · Пхали-Хинкали</span>
</header>
<div class="cards">
<a class="card" href="chai.html">
<span class="card-name">Чайная карта</span>
<span class="card-arrow">→</span>
</a>
<div class="card disabled">
<span class="card-name">Кофейная карта</span>
<span class="soon">Скоро</span>
</div>
<div class="card disabled">
<span class="card-name">Десерты</span>
<span class="soon">Скоро</span>
</div>
</div>
</div>
<footer>d.b wish</footer>
</body>
</html>
