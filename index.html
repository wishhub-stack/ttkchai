<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1" name="viewport"/>
<meta content="#161210" name="theme-color"/>
<title>Wish Ember · Хачо и Пури / Пхали-Хинкали</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root{
    --page-bg:#161210;
    --panel-bg:#1B1613;
    --panel-line:#2C221B;
    --ink:#F4ECDF;
    --muted:#96877A;
    --accent:#C88A4E;
    --accent-line:rgba(200,138,78,0.30);

    --tea-surface:#F4ECDF;
    --tea-ink:#332C2C;
    --tea-muted:#6D6262;

    --bar-surface:#241611;
    --bar-line:rgba(200,138,78,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:48px 16px 60px;
  }
  .wrap{max-width:520px; margin:0 auto;}

  /* ---------- Restaurant panel ---------- */
  .rest-panel{
    background:var(--panel-bg); border:1px solid var(--panel-line); border-radius:20px;
    padding:22px 18px 20px; margin-bottom:24px;
  }
  .rest-panel:first-child{margin-top:0;}
  .rest-panel:last-child{margin-bottom:0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:.64rem; letter-spacing:.12em;
    color:var(--accent); text-align:center; text-transform:uppercase; margin:0 0 10px;
  }
  .rest-name{
    font-family:'Manrope',sans-serif; font-size:1.32rem; font-weight:700; margin:0;
    letter-spacing:-.02em; line-height:1.15; text-align:center; color:var(--ink);
  }
  .rest-logo{height:56px; width:auto; display:block; margin:0 auto;}
  .divider{
    width:100%; height:1px; background:var(--panel-line); margin:16px 0 16px;
  }
  .cards{display:flex; flex-direction:column; gap:10px;}

  a.card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-radius:14px;
    padding:16px 18px; text-decoration:none;
    transition:border-color .15s ease, box-shadow .18s ease, transform .18s ease;
  }
  @media (hover:hover){
    a.card:hover{ transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,0.28); }
  }

  /* Tea card: the bright cream identity, with the recolored medallion texture as a
     faint watermark so the ornament reads without fighting the logo. */
  a.card.card-tea{
    position:relative; justify-content:center;
    background-color:var(--tea-surface);
    background-image:linear-gradient(rgba(244,236,223,0.37), rgba(244,236,223,0.37)), url("bg-chai.jpg");
    background-size:460px auto, 460px auto;
    background-position:top center, top center;
    background-repeat:repeat, repeat;
    color:var(--tea-ink);
  }
  .card-name{font-family:'Fraunces',serif; font-size:1.08rem; font-weight:500;}
  .card-text-center{display:flex; flex-direction:column; align-items:center; gap:7px; width:100%;}
  .tea-logo{height:25px; width:auto; display:block;}
  .tea-logo-muted{filter:grayscale(1) opacity(.5);}
  .card-arrow-corner{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-family:'IBM Plex Mono',monospace; font-size:1rem; color:var(--tea-muted);
  }
  .card-text{display:flex; flex-direction:column; gap:3px;}
  .card-date{
    font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.04em;
    color:var(--tea-muted);
  }

  /* Bar card: the copper-warmed dark identity, cocktail-line watermark texture. */
  a.card.card-bar{
    position:relative; justify-content:center;
    background-color:var(--bar-surface);
    background-image:linear-gradient(rgba(27,18,13,0.55), rgba(27,18,13,0.55)), url("bg-bar.jpg");
    background-size:420px auto, 420px auto;
    background-position:top center, top center;
    background-repeat:repeat, repeat;
    border:1px solid var(--bar-line);
  }
  .bar-logo{height:26px; width:auto; display:block;}
  a.card.card-bar .card-date{color:var(--accent);}
  a.card.card-bar .card-arrow-corner{color:var(--accent);}

  /* Plain "nothing here yet" placeholder — used only where a section genuinely
     hasn't been started (Пхали-Хинкали, both cards). */
  .card.disabled{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:transparent; border:1.5px dashed var(--panel-line); border-radius:14px;
    padding:16px 18px; color:var(--muted); cursor:default;
  }
  .card.disabled .card-name{color:var(--muted); font-weight:400;}
  .card.disabled .card-date{color:var(--muted);}

  footer{
    max-width:520px; margin:36px auto 0; padding:0 18px; color:var(--muted);
    font-size:.74rem; line-height:1.5; text-align:center;
  }

  /* ---------- Signature: tap "d.b wish" and contact details fade in beneath it ---------- */
  .sig{border:none; padding:0; margin-top:36px; text-align:center;}
  .sig-input{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;
  }
  .sig-name{
    display:inline-block; cursor:pointer; padding:4px 3px;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .2s ease;
  }
  .sig-logo{height:24px; width:auto; display:block;}
  @media (hover:hover){
    .sig-name:hover{ opacity:.75; }
  }
  .sig-reveal{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    max-height:0; opacity:0; filter:blur(6px); transform:translateY(-4px) scale(.96);
    overflow:hidden; pointer-events:none;
    transition:max-height 1.15s cubic-bezier(.16,1,.3,1),
               opacity 1.05s ease .12s,
               filter 1.05s ease .12s,
               transform 1.1s cubic-bezier(.16,1,.3,1) .08s;
  }
  .sig-input:checked ~ .sig-reveal{
    max-height:70px; opacity:1; filter:blur(0); transform:translateY(0) scale(1);
    pointer-events:auto; margin-top:6px;
  }
  .sig-tg{
    font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:.8rem;
    letter-spacing:.03em; color:var(--accent); text-decoration:none;
    border-bottom:1px dotted var(--accent-line);
  }
  .sig-caption{
    font-family:'Manrope',sans-serif; font-size:.66rem; color:var(--muted);
    max-width:260px; line-height:1.45;
  }

  /* При старте перехода весь остальной контент плавно уходит — в фокусе
     остаётся только летящая карточка (клон, добавленный поверх). */
  body.fly-active > .wrap,
  body.fly-active > footer.sig{
    transition:opacity .3s ease;
    opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="wrap">

<section class="rest-panel">
<p class="eyebrow">Главное меню</p>
<h2 class="rest-name"><img class="rest-logo" src="logo-hacho-puri-light.png" alt="Хачо и Пури"/></h2>
<div class="divider"></div>
<div class="cards">
<a class="card card-tea" href="chai.html" data-final-logo-height="36" data-final-logo-top="12">
<span class="card-text-center">
<img class="tea-logo" src="logo-chai-wide.png" alt="Чайная карта"/>
<span class="card-date">27.07.2026</span>
</span>
<span class="card-arrow-corner">→</span>
</a>
<a class="card card-bar" href="bar.html" data-final-logo-height="34" data-final-logo-top="20">
<span class="card-text-center">
<img class="bar-logo" src="logo-bar-wide-light.png" alt="Барная карта"/>
<span class="card-date">Демо</span>
</span>
<span class="card-arrow-corner">→</span>
</a>
</div>
</section>

<section class="rest-panel">
<p class="eyebrow">Главное меню</p>
<h2 class="rest-name">Пхали-Хинкали</h2>
<div class="divider"></div>
<div class="cards">
<div class="card disabled">
<span class="card-text-center">
<img class="tea-logo tea-logo-muted" src="logo-chai-wide.png" alt="Чайная карта"/>
<span class="card-date">Скоро</span>
</span>
</div>
<div class="card disabled">
<span class="card-text">
<span class="card-name">Барная карта</span>
<span class="card-date">Скоро</span>
</span>
</div>
</div>
</section>

</div>

<footer class="sig">
  <input type="checkbox" id="sig-toggle" class="sig-input"/>
  <label for="sig-toggle" class="sig-name"><img alt="d.b wish" class="sig-logo" src="sig-wish-dark.png"/></label>
  <div class="sig-reveal">
    <a class="sig-tg" href="https://t.me/wish_tgm" target="_blank" rel="noopener">@wish_tgm</a>
    <span class="sig-caption">Пишите по предложениям и изменениям под ваши конкретные желания</span>
  </div>
</footer>

<script>
(function(){
  var EASE = 'cubic-bezier(.4,0,.2,1)';
  var TOTAL_MS = 1100;        // единая длительность роста/сжатия кнопки — двигается ВСЁ разом, с этой же скоростью едет и текст
  var TEXT_FADE_MS = 240;     // сколько длится исчезновение текста в самом конце полёта
  var CLONE_FADE_MS = 380;    // при возврате: плавное растворение клона в настоящую (уже с узором) кнопку — без щелчка
  var OVERSCAN = 24;          // запас за края экрана — гарантирует идеальную заливку без шва по краю
  var REVEAL_DELAY_MS = 220;  // при возврате: пауза после того, как кнопка встала на место
  var REVEAL_MS = 700;        // при возврате: остальной контент проявляется медленно, а не рывком

  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var ORIGINAL_THEME_COLOR = themeMeta ? themeMeta.getAttribute('content') : null;
  function setThemeColor(c){
    if(themeMeta && c) themeMeta.setAttribute('content', c);
  }

  // Список карточек, которые в момент ухода со страницы остались "подвешены"
  // в летящем состоянии. Если браузер восстановит эту страницу из bfcache при
  // нажатии "назад" — здесь будет запись, и мы аккуратно соберём карточку
  // обратно, без перезагрузки.
  var activeFlights = [];

  function attachFly(link){
    link.addEventListener('click', function(e){
      // Открытие в новой вкладке / модификаторы — не трогаем, пусть работает как обычная ссылка
      if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduceMotion) return; // обычный переход без анимации

      e.preventDefault();
      var targetHref = link.getAttribute('href');
      var finalLogoH = parseInt(link.getAttribute('data-final-logo-height'), 10) || 30;
      var finalLogoTop = parseInt(link.getAttribute('data-final-logo-top'), 10);
      if(isNaN(finalLogoTop)) finalLogoTop = 14;

      // Синхронизируем цвет системной шторки браузера с цветом, в который
      // вот-вот превратится весь экран — чтобы она не переключалась рывком
      // отдельно от нашей анимации.
      setThemeColor(getComputedStyle(link).backgroundColor);

      document.body.classList.add('fly-active'); // остальной контент уходит

      var rect = link.getBoundingClientRect();
      var clone = link.cloneNode(true);
      clone.classList.add('fly-clone');
      clone.removeAttribute('href');
      clone.removeAttribute('data-final-logo-height');
      clone.removeAttribute('data-final-logo-top');
      clone.style.position = 'fixed';
      clone.style.margin = '0';
      clone.style.top = rect.top + 'px';
      clone.style.left = rect.left + 'px';
      clone.style.width = rect.width + 'px';
      clone.style.height = rect.height + 'px';
      clone.style.zIndex = '99999';
      clone.style.pointerEvents = 'none';
      clone.style.borderRadius = getComputedStyle(link).borderRadius;
      clone.style.willChange = 'top, left, width, height';
      // Фон намеренно НЕ убираем: тайл задан в фиксированных пикселях (не %),
      // поэтому при росте коробки он не тянется и не даёт швов — просто
      // становится видно больше повторов того же узора, что и на самой
      // странице назначения. Так переход ощущается как проявление настоящего
      // фона, а не как заливка сплошным цветом.

      document.body.appendChild(clone);
      link.style.visibility = 'hidden'; // прячем оригинал, место в макете не трогаем
      activeFlights.push({ link: link, clone: clone });

      var cloneText = clone.querySelector('.card-text-center');
      var cloneLogo = clone.querySelector('.tea-logo, .bar-logo');
      var cloneDate = clone.querySelector('.card-date');
      var cloneArrow = clone.querySelector('.card-arrow-corner');

      // Текст — на собственном позиционировании "поверх экрана", полностью
      // независимом от коробки вокруг. Едет туда же и с той же скоростью,
      // что и сама коробка — оба движения ощущаются одним целым, без спешки.
      if(cloneText){
        var textRectNow = cloneText.getBoundingClientRect();
        cloneText.style.position = 'fixed';
        cloneText.style.left = '0';
        cloneText.style.top = textRectNow.top + 'px';
        cloneText.style.margin = '0';
      }

      function goToPage(){
        try{ sessionStorage.setItem('fly:' + targetHref, '1'); }catch(err){}
        window.location.href = targetHref;
      }

      clone.style.transition =
        'top ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'left ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'width ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'height ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'border-radius ' + TOTAL_MS + 'ms ' + EASE;
      if(cloneText){
        cloneText.style.transition = 'top ' + TOTAL_MS + 'ms ' + EASE;
      }
      if(cloneArrow){
        cloneArrow.style.transition = 'opacity .25s ease';
      }
      if(cloneLogo){
        cloneLogo.style.transition = 'height ' + TOTAL_MS + 'ms ' + EASE;
      }
      if(cloneDate){
        cloneDate.style.transition = 'font-size ' + TOTAL_MS + 'ms ' + EASE;
      }

      // форсируем рефлоу, чтобы браузер зафиксировал стартовое состояние
      void clone.offsetHeight;

      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          clone.style.top = (-OVERSCAN) + 'px';
          clone.style.left = (-OVERSCAN) + 'px';
          clone.style.width = (window.innerWidth + OVERSCAN * 2) + 'px';
          clone.style.height = (window.innerHeight + OVERSCAN * 2) + 'px';
          clone.style.borderRadius = '0px';
          if(cloneText) cloneText.style.top = finalLogoTop + 'px'; // точная позиция в реальной шапке
          if(cloneArrow) cloneArrow.style.opacity = '0';
          // Лого и дата остаются видимыми и просто уменьшаются до размера,
          // который они займут в реальной шапке — это то самое "оставить
          // кнопку видимой", а не спрятать её перед переходом.
          if(cloneLogo){ cloneLogo.style.height = finalLogoH + 'px'; }
          if(cloneDate){ cloneDate.style.fontSize = '.64rem'; }

          setTimeout(goToPage, TOTAL_MS + 60);
        });
      });
    });
  }

  var flyLinks = document.querySelectorAll('a.card.card-tea, a.card.card-bar');
  for(var i = 0; i < flyLinks.length; i++){ attachFly(flyLinks[i]); }

  // ---------- Возврат назад без перезагрузки ----------
  // Если браузер восстанавливает эту страницу из bfcache (кнопка "назад" после
  // перехода в чайную/барную карту), она будет заморожена ровно в момент ухода —
  // то есть с летящим клоном на весь экран и спрятанной настоящей карточкой.
  // Вместо перезагрузки — зеркально собираем всё обратно: коробка и текст едут
  // единым движением, затем клон плавно растворяется в настоящую (уже с узором)
  // карточку — без щелчка, — и только потом, с паузой и медленно, проявляется
  // остальной контент.
  function reverseCollapse(flight){
    var link = flight.link, clone = flight.clone;

    if(!clone || !clone.parentNode){
      document.body.classList.remove('fly-active');
      if(link) link.style.visibility = '';
      if(ORIGINAL_THEME_COLOR) setThemeColor(ORIGINAL_THEME_COLOR);
      return;
    }

    var cloneText = clone.querySelector('.card-text-center');
    var cloneLogo = clone.querySelector('.tea-logo, .bar-logo');
    var cloneDate = clone.querySelector('.card-date');
    var cloneArrow = clone.querySelector('.card-arrow-corner');

    // Настоящая карточка всё ещё скрыта (visibility:hidden), но её геометрия
    // никуда не делась — берём оттуда ТОЧНУЮ цель для текста и коробки,
    // без каких-либо приближений.
    var rect = link.getBoundingClientRect();
    var naturalTextTop = rect.top;
    if(cloneText){
      var linkText = link.querySelector('.card-text-center');
      if(linkText) naturalTextTop = linkText.getBoundingClientRect().top;
    }
    var realRadius = getComputedStyle(link).borderRadius;

    clone.style.transition =
      'top ' + TOTAL_MS + 'ms ' + EASE + ',' +
      'left ' + TOTAL_MS + 'ms ' + EASE + ',' +
      'width ' + TOTAL_MS + 'ms ' + EASE + ',' +
      'height ' + TOTAL_MS + 'ms ' + EASE + ',' +
      'border-radius ' + TOTAL_MS + 'ms ' + EASE;
    if(cloneText){
      cloneText.style.transition = 'top ' + TOTAL_MS + 'ms ' + EASE;
    }
    if(cloneArrow){
      cloneArrow.style.transition = 'opacity .3s ease';
    }
    if(cloneLogo){
      cloneLogo.style.transition =
        'height ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'opacity ' + TEXT_FADE_MS + 'ms ease';
    }
    if(cloneDate){
      cloneDate.style.transition =
        'font-size ' + TOTAL_MS + 'ms ' + EASE + ',' +
        'opacity ' + TEXT_FADE_MS + 'ms ease';
    }

    void clone.offsetHeight;

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        clone.style.top = rect.top + 'px';
        clone.style.left = rect.left + 'px';
        clone.style.width = rect.width + 'px';
        clone.style.height = rect.height + 'px';
        clone.style.borderRadius = realRadius;
        if(cloneText) cloneText.style.top = naturalTextTop + 'px';
        if(cloneArrow) cloneArrow.style.opacity = '1';
        if(cloneLogo){ cloneLogo.style.height = ''; cloneLogo.style.opacity = '1'; }
        if(cloneDate){ cloneDate.style.fontSize = ''; cloneDate.style.opacity = '1'; }
      });
    });

    // Коробка и текст пришли на точное место настоящей кнопки. Показываем
    // настоящую (уже с узором фона) кнопку под клоном и плавно растворяем
    // клон поверх неё — узор проступает мягко, а не щелчком.
    setTimeout(function(){
      if(link) link.style.visibility = '';
      clone.style.willChange = '';
      clone.style.transition = 'opacity ' + CLONE_FADE_MS + 'ms ease';
      void clone.offsetHeight;
      clone.style.opacity = '0';

      setTimeout(function(){
        if(clone.parentNode) clone.parentNode.removeChild(clone);
        if(ORIGINAL_THEME_COLOR) setThemeColor(ORIGINAL_THEME_COLOR);

        // Кнопка давно на месте — и только теперь, с небольшой паузой и
        // намеренно медленно, проявляется обратно всё остальное содержимое.
        setTimeout(function(){
          var wrap = document.querySelector('.wrap');
          var sig = document.querySelector('footer.sig');
          var slowFade = 'opacity ' + REVEAL_MS + 'ms ease';
          if(wrap) wrap.style.transition = slowFade;
          if(sig) sig.style.transition = slowFade;
          document.body.classList.remove('fly-active');

          setTimeout(function(){
            if(wrap) wrap.style.transition = '';
            if(sig) sig.style.transition = '';
          }, REVEAL_MS + 50);
        }, REVEAL_DELAY_MS);
      }, CLONE_FADE_MS + 20);
    }, TOTAL_MS + 40);
  }

  window.addEventListener('pageshow', function(){
    if(!activeFlights.length) return;
    var flights = activeFlights;
    activeFlights = [];
    for(var i = 0; i < flights.length; i++){ reverseCollapse(flights[i]); }
  });
})();
</script>

</body>
</html>
